<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You ❤️</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: #f7839d;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Georgia, serif;
}

/* floating hearts */

.heart {
    position: fixed;
    color: #d7193f;
    font-size: 30px;
    animation: float 6s linear infinite;
}

.heart:nth-child(1) {
    left: 10%;
    animation-delay: 0s;
}

.heart:nth-child(2) {
    left: 30%;
    animation-delay: 2s;
}

.heart:nth-child(3) {
    left: 55%;
    animation-delay: 1s;
}

.heart:nth-child(4) {
    left: 80%;
    animation-delay: 3s;
}

@keyframes float {

    0% {
        bottom: -50px;
        opacity: 0;
        transform: rotate(0deg);
    }

    20% {
        opacity: 1;
    }

    100% {
        bottom: 110%;
        opacity: 0;
        transform: rotate(30deg);
    }
}


/* envelope */

.envelope {
    width: 320px;
    height: 210px;
    position: relative;
    cursor: pointer;
}


/* inside */

.inside {
    position: absolute;
    width: 100%;
    height: 100%;
    background: #e9c45d;
    z-index: 1;
}


/* letter */

.letter {
    position: absolute;
    width: 88%;
    height: 185px;
    left: 6%;
    top: 5px;

    background: white;

    padding: 22px 15px;

    text-align: center;

    z-index: 2;

    transition: 1s ease;
}

.letter p {
    margin: 0;
    color: #49383d;
    font-size: 16px;
    line-height: 1.55;
}

.cute {
    font-size: 38px;
    margin-top: 12px;
}

.last {
    font-weight: bold;
    margin-top: 8px !important;
    font-size: 15px !important;
}


/* envelope front */

.front {
    position: absolute;
    width: 100%;
    height: 100%;
    background: #f3d36b;

    z-index: 4;

    clip-path: polygon(
        0 0,
        50% 55%,
        100% 0,
        100% 100%,
        0 100%
    );
}


/* flap */

.flap {
    position: absolute;

    width: 100%;
    height: 120px;

    background: #f8dc78;

    clip-path: polygon(
        0 0,
        50% 75%,
        100% 0
    );

    z-index: 6;

    transform-origin: top;

    transition: 1s ease;
}


/* heart seal */

.seal {
    position: absolute;

    left: 50%;
    top: 90px;

    transform: translateX(-50%);

    width: 50px;
    height: 50px;

    background: #e63950;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 25px;

    z-index: 8;

    transition: .5s;
}


/* OPEN */

.envelope.open .flap {
    transform: rotateX(180deg);
}

.envelope.open .letter {
    transform: translateY(-145px);
    z-index: 7;
}

.envelope.open .seal {
    opacity: 0;
    transform: translateX(-50%) scale(0);
}


/* text */

.tap {
    position: fixed;
    bottom: 40px;

    color: white;

    font-family: Arial, sans-serif;

    font-size: 14px;

    letter-spacing: 1px;
}

</style>
</head>


<body>


<div class="heart">♥</div>
<div class="heart">♥</div>
<div class="heart">♥</div>
<div class="heart">♥</div>


<div class="envelope" id="envelope">


    <div class="inside"></div>


    <div class="letter">

        <p>
            Just a little note to remind you
            that you're genuinely special to me.
            <br><br>
            I hope you always remember how loved
            and appreciated you are.
        </p>

        <div class="cute">
            ♡
        </div>

        <p class="last">
            Keep smiling, okay?
            You deserve all the good things. ❤️
        </p>

    </div>


    <div class="front"></div>


    <div class="flap"></div>


    <div class="seal">
        ❤️
    </div>


</div>


<div class="tap">
    tap the envelope ♡
</div>


<script>

document.getElementById("envelope").onclick = function() {

    this.classList.toggle("open");

};

</script>


</body>
</html>
