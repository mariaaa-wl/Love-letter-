<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Letter</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;

    background:
    radial-gradient(circle at 50% 45%,
    rgba(255,255,255,.13),
    transparent 40%),
    linear-gradient(135deg,#f87595,#ff91aa,#f77b9b);

    font-family:Georgia,"Times New Roman",serif;
}


/* BACKGROUND GLOW */

.glow{
    position:fixed;
    width:300px;
    height:300px;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    filter:blur(45px);
    pointer-events:none;
}

.glow1{
    top:-140px;
    left:-130px;
}

.glow2{
    right:-140px;
    bottom:-130px;
}


/* BACKGROUND GLITTER */

.glitter{
    position:fixed;
    width:3px;
    height:3px;
    border-radius:50%;
    background:white;

    box-shadow:
    0 0 5px white,
    0 0 12px rgba(255,255,255,.9);

    pointer-events:none;
    z-index:1;

    animation:
    twinkle var(--speed)
    ease-in-out infinite;

    animation-delay:var(--delay);
}

@keyframes twinkle{
    0%,100%{
        opacity:.15;
        transform:scale(.5);
    }

    50%{
        opacity:1;
        transform:scale(1.7);
    }
}


/* FLOATING HEARTS */

.heart{
    position:fixed;
    width:9px;
    height:9px;
    background:#d91d49;
    transform:rotate(45deg);

    bottom:-30px;
    opacity:.5;

    pointer-events:none;

    animation:
    floatHeart var(--time)
    linear infinite;

    animation-delay:var(--delay);
    z-index:2;
}

.heart:before,
.heart:after{
    content:"";
    position:absolute;
    width:9px;
    height:9px;
    background:#d91d49;
    border-radius:50%;
}

.heart:before{
    left:-4.5px;
}

.heart:after{
    top:-4.5px;
}

@keyframes floatHeart{
    0%{
        transform:
        translateY(0)
        rotate(45deg)
        scale(.6);
        opacity:0;
    }

    15%{
        opacity:.6;
    }

    100%{
        transform:
        translateY(-115vh)
        rotate(70deg)
        scale(1);
        opacity:0;
    }
}


/* ENVELOPE CONTAINER */

.envelope{
    position:relative;

    width:325px;
    height:215px;

    cursor:pointer;
    z-index:10;

    filter:
    drop-shadow(
    0 18px 25px
    rgba(100,20,45,.25));

    animation:
    gentleFloat 3s
    ease-in-out infinite;
}

@keyframes gentleFloat{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-5px);
    }
}


/* LETTER */

.letter{
    position:absolute;

    width:90%;
    height:480px;

    left:5%;
    top:0;

    background:#fffdfa;

    border-radius:4px;

    padding:28px 17px;

    text-align:center;

    color:#4b373d;

    box-shadow:
    0 8px 22px
    rgba(70,20,35,.14);

    z-index:2;

    /*
       পুরো letter শুরুতে hidden
    */

    clip-path:inset(0 0 100% 0);

    transition:
    transform 1s cubic-bezier(.16,.85,.32,1.15),
    clip-path 1s ease,
    box-shadow .7s ease;
}


/* LETTER INNER BORDER */

.letter:before{
    content:"";

    position:absolute;

    inset:10px;

    border:
    1px solid #f0dce1;

    pointer-events:none;
}


/* MESSAGE */

.message{
    position:relative;
    z-index:2;

    margin:0;

    font-size:16px;
    line-height:1.55;
}


/* ENDING */

.ending{
    position:relative;
    z-index:2;

    margin-top:24px;
}


/* OUTLINE HEARTS */

.outline-hearts{
    display:flex;
    justify-content:center;
    gap:28px;

    margin-bottom:25px;
}

.outline-heart{
    position:relative;

    width:27px;
    height:27px;

    transform:rotate(-45deg);

    border-left:
    3px solid #e27694;

    border-bottom:
    3px solid #e27694;
}

.outline-heart:before{
    content:"";

    position:absolute;

    width:25px;
    height:25px;

    top:-13px;
    left:0;

    border-top:
    3px solid #e27694;

    border-left:
    3px solid #e27694;

    border-radius:50% 50% 0 50%;
}

.outline-heart:after{
    content:"";

    position:absolute;

    width:25px;
    height:25px;

    top:0;
    left:11px;

    border-top:
    3px solid #e27694;

    border-right:
    3px solid #e27694;

    border-radius:50% 50% 50% 0;
}


/* FINAL SENTENCE */

.keep{
    font-size:17px;
    line-height:1.5;

    font-weight:bold;

    margin:0;
}

.keep-heart{
    font-size:26px;
    vertical-align:middle;
}


/* ENVELOPE */

.envelope-body{
    position:absolute;

    width:100%;
    height:100%;

    background:
    linear-gradient(
    145deg,
    #f8d975,
    #edc958);

    border-radius:9px;

    overflow:hidden;

    z-index:5;

    transition:
    transform .9s cubic-bezier(.2,.8,.3,1),
    opacity .65s ease;
}


/* ENVELOPE FOLD */

.envelope-body:before{
    content:"";

    position:absolute;

    width:100%;
    height:100%;

    background:#e6bd4d;

    clip-path:
    polygon(
    0 0,
    50% 58%,
    100% 0,
    100% 100%,
    0 100%
    );
}


/* DOTTED BORDER */

.envelope-body:after{
    content:"";

    position:absolute;

    inset:8px;

    border:
    2px dashed
    rgba(255,255,255,.7);

    border-radius:7px;
}


/* HEART SEAL */

.seal{
    position:absolute;

    width:54px;
    height:54px;

    left:50%;
    top:50%;

    transform:
    translate(-50%,-50%);

    border-radius:50%;

    background:
    radial-gradient(
    circle at 35% 30%,
    #f56d86,
    #df3655);

    display:flex;
    justify-content:center;
    align-items:center;

    color:white;
    font-size:23px;

    box-shadow:
    0 5px 12px
    rgba(100,0,30,.25),
    0 0 0 5px
    rgba(255,255,255,.18);

    z-index:8;

    transition:
    opacity .4s ease,
    transform .5s ease;
}


/* RIBBON */

.ribbon{
    position:absolute;

    width:62px;
    height:18px;

    left:50%;
    bottom:-5px;

    transform:
    translateX(-50%);

    background:#ed7189;

    border-radius:5px;

    z-index:9;

    transition:
    opacity .5s ease,
    transform .6s ease;
}


/* TAP TEXT */

.tap{
    position:absolute;

    left:50%;
    bottom:18px;

    transform:
    translateX(-50%);

    color:rgba(255,255,255,.95);

    font-family:Arial,sans-serif;

    font-size:12px;

    letter-spacing:1.8px;

    white-space:nowrap;

    z-index:20;

    pointer-events:none;

    text-shadow:
    0 1px 4px
    rgba(120,40,60,.25);

    animation:
    tapPulse 1.8s
    ease-in-out infinite;

    transition:
    opacity .4s ease;
}

@keyframes tapPulse{
    0%,100%{
        opacity:.55;
    }

    50%{
        opacity:1;
    }
}


/* =========================
   OPEN ANIMATION
========================= */

.envelope.open .letter{

    /* envelope সরলে পুরো letter দেখা যাবে */

    clip-path:
    inset(0 0 0 0);

    transform:
    translateY(-185px);

    z-index:30;

    box-shadow:
    0 18px 40px
    rgba(70,20,35,.22);
}


.envelope.open .envelope-body{
    transform:
    translateY(290px)
    scale(.9);

    opacity:0;

    pointer-events:none;
}


.envelope.open .seal{
    opacity:0;

    transform:
    translate(-50%,-50%)
    scale(0);
}


.envelope.open .ribbon{
    opacity:0;

    transform:
    translateX(-50%)
    translateY(30px);
}


.envelope.open .tap{
    opacity:0;
}


.envelope.open{
    animation:none;
}


/* =========================
   GLITTER BURST
========================= */

.burst{
    position:fixed;

    width:4px;
    height:4px;

    border-radius:50%;

    background:white;

    box-shadow:
    0 0 5px white,
    0 0 12px white,
    0 0 20px
    rgba(255,255,255,.95);

    pointer-events:none;

    opacity:0;

    z-index:100;

    animation:
    burstOut 1.15s
    cubic-bezier(.12,.72,.22,1)
    forwards;
}

@keyframes burstOut{

    0%{
        opacity:0;

        transform:
        translate(-50%,-50%)
        scale(.2);
    }

    12%{
        opacity:1;
    }

    100%{
        opacity:0;

        transform:
        translate(
        calc(-50% + var(--x)),
        calc(-50% + var(--y))
        )
        scale(var(--size));
    }
}


/* MOBILE */

@media(max-width:380px){

    .envelope{
        width:290px;
        height:195px;
    }

    .
