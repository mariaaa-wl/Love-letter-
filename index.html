<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Little Letter ❤️</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    overflow: hidden;

    display: flex;
    justify-content: center;
    align-items: center;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(255,255,255,.16),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #f87595,
            #ff91aa,
            #f97d9d
        );

    font-family: Georgia, "Times New Roman", serif;

    position: relative;
}


/* =====================================================
   BACKGROUND GLOW
===================================================== */

.glow {
    position: fixed;

    width: 280px;
    height: 280px;

    border-radius: 50%;

    background: rgba(255,255,255,.09);

    filter: blur(35px);

    pointer-events: none;
}

.glow.one {
    top: -100px;
    left: -100px;
}

.glow.two {
    bottom: -120px;
    right: -100px;
}


/* =====================================================
   GLITTER
===================================================== */

.glitter {
    position: fixed;

    width: 4px;
    height: 4px;

    background: white;

    border-radius: 50%;

    pointer-events: none;

    opacity: .7;

    box-shadow:
        0 0 4px white,
        0 0 9px rgba(255,255,255,.9);

    animation:
        glitterTwinkle var(--duration) ease-in-out infinite;

    animation-delay: var(--delay);

    z-index: 2;
}

@keyframes glitterTwinkle {

    0% {
        opacity: .15;
        transform: scale(.4);
    }

    50% {
        opacity: 1;
        transform: scale(1.5);
    }

    100% {
        opacity: .15;
        transform: scale(.4);
    }
}


/* =====================================================
   FLOATING HEARTS
===================================================== */

.heart {
    position: fixed;

    bottom: -30px;

    width: 10px;
    height: 10px;

    background: #d91c48;

    transform: rotate(45deg);

    opacity: .65;

    animation: heartFloat var(--time) linear infinite;

    animation-delay: var(--delay);

    pointer-events: none;

    z-index: 3;
}

.heart::before,
.heart::after {

    content: "";

    position: absolute;

    width: 10px;
    height: 10px;

    background: #d91c48;

    border-radius: 50%;
}

.heart::before {
    left: -5px;
}

.heart::after {
    top: -5px;
}

@keyframes heartFloat {

    0% {
        transform:
            translateY(0)
            rotate(45deg)
            scale(.7);

        opacity: 0;
    }

    15% {
        opacity: .7;
    }

    100% {
        transform:
            translateY(-115vh)
            rotate(70deg)
            scale(1);

        opacity: 0;
    }
}


/* =====================================================
   ENVELOPE
===================================================== */

.envelope {

    position: relative;

    width: 325px;
    height: 215px;

    cursor: pointer;

    z-index: 10;

    filter:
        drop-shadow(
            0 18px 25px rgba(110,25,50,.25)
        );

    animation: envelopeFloat 3s ease-in-out infinite;

    transition: .6s ease;
}

@keyframes envelopeFloat {

    0%,
    100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-5px);
    }
}


/* =====================================================
   LETTER
===================================================== */

.letter {

    position: absolute;

    width: 90%;

    min-height: 250px;

    left: 5%;
    top: 5px;

    padding: 28px 20px;

    background:
        linear-gradient(
            rgba(255,255,255,.98),
            rgba(255,252,248,.98)
        );

    border-radius: 4px;

    text-align: center;

    color: #49363c;

    box-shadow:
        0 7px 20px rgba(80,20,40,.14);

    z-index: 2;

    transition:
        transform 1.1s cubic-bezier(.16,.85,.32,1.2),
        box-shadow .8s ease;
}


/* paper border */

.letter::before {

    content: "";

    position: absolute;

    inset: 10px;

    border: 1px solid #f1dfe3;

    pointer-events: none;
}


/* little paper shine */

.letter::after {

    content: "";

    position: absolute;

    width: 70px;
    height: 70px;

    top: -25px;
    right: -25px;

    background: rgba(255,255,255,.4);

    border-radius: 50%;

    filter: blur(10px);

    pointer-events: none;
}


.message {

    position: relative;

    margin: 0;

    font-size: 17px;

    line-height: 1.65;

    z-index: 2;
}


.cute-line {

    position: relative;

    margin: 12px 0 8px;

    color: #ec6883;

    font-size: 26px;

    letter-spacing: 7px;

    z-index: 2;
}


.last {

    position: relative;

    margin: 0;

    font-size: 15px;

    line-height: 1.55;

    font-weight: bold;

    z-index: 2;
}


/* =====================================================
   ENVELOPE BODY
===================================================== */

.envelope-body {

    position: absolute;

    width: 100%;
    height: 100%;

    background:
        linear-gradient(
            145deg,
            #f7d873,
            #efcb61
        );

    border-radius: 9px;

    overflow: hidden;

    z-index: 4;

    transition:
        transform .9s cubic-bezier(.2,.8,.3,1),
        opacity .7s ease;
}


/* envelope fold */

.envelope-body::before {

    content: "";

    position: absolute;

    width: 100%;
    height: 100%;

    background: #e7bf52;

    clip-path:
        polygon(
            0 0,
            50% 58%,
            100% 0,
            100% 100%,
            0 100%
        );
}


/* decorative border */

.envelope-body::after {

    content: "";

    position: absolute;

    inset: 8px;

    border: 2px dashed rgba(255,255,255,.65);

    border-radius: 7px;

    pointer-events: none;
}


/* =====================================================
   SEAL
===================================================== */

.seal {

    position: absolute;

    width: 54px;
    height: 54px;

    left: 50%;
    bottom: 72px;

    transform:
        translateX(-50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #f46b84,
            #df3855
        );

    display: flex;

    align-items: center;
    justify-content: center;

    color: white;

    font-size: 22px;

    box-shadow:
        0 5px 12px rgba(100,0,30,.25),
        0 0 0 5px rgba(255,255,255,.18);

    z-index: 8;

    transition:
        opacity .45s ease,
        transform .55s ease;
}


/* =====================================================
   RIBBON
===================================================== */

.ribbon {

    position: absolute;

    width: 62px;
    height: 18px;

    left: 50%;
    bottom: -5px;

    transform:
        translateX(-50%);

    background: #ed7189;

    border-radius: 5px;

    z-index: 9;

    transition:
        opacity .5s ease,
        transform .6s ease;
}


/* =====================================================
   OPEN ANIMATION
===================================================== */

.envelope.open {

    animation: none;
}


.envelope.open .letter {

    transform:
        translateY(-145px)
        scale(1.03);

    z-index: 30;

    box-shadow:
        0 18px 40px rgba(70,20,40,.20);
}


/* envelope completely disappears */

.envelope.open .envelope-body {

    transform:
        translateY(280px)
        scale(.92);

    opacity: 0;

    pointer-events: none;
}


/* seal disappears */

.envelope.open .seal {

    opacity: 0;

    transform:
        translateX(-50%)
        scale(0);
}


/* ribbon disappears */

.envelope.open .ribbon {

    opacity: 0;

    transform:
        translateX(-50%)
        translateY(30px);
}


/* =====================================================
   BURST GLITTER
===================================================== */

.burst {

    position: fixed;

    width: 5px;
    height: 5px;

    border-radius: 50%;

    background: white;

    box-shadow:
        0 0 5px white,
        0 0 12px white;

    pointer-events: none;

    opacity: 0;

    z-index: 50;
}

.envelope.open .burst {

    animation:
        burstAnimation .9s ease-out forwards;
}


@keyframes burstAnimation {

    0% {

        opacity: 1;

        transform:
            translate(0,0)
            scale(.3);
    }

    100% {

        opacity: 0;

        transform:
            translate(
                var(--x),
                var(--y)
            )
            scale(1.4);
    }
}


/* =====================================================
   SIDE GLITTER
===================================================== */

.side-glitter {

    position: fixed;

    width: 3px;
    height: 3px;

    background: white;

    border-radius: 50%;

    box-shadow:
        0 0 5px white,
        0 0 10px white;

    opacity: 0;

    pointer-events: none;

    z-index: 40;
}


.envelope.open .side-glitter {

    animation:
        sideExplosion 1s ease-out forwards;
}


@keyframes sideExplosion {

    0% {
        opacity: 1;
        transform: scale(.3);
    }

    100% {
        opacity: 0;
        transform:
            translate(
                var(--sx),
                var(--sy)
            )
            scale(1.5);
    }
}


/* =====================================================
   TAP TEXT
===================================================== */

.tap {

    position: fixed;

    bottom: 38px;

    color: rgba(255,255,255,.85);

    font-family: Arial, sans-serif;

    font-size: 14px;

    letter-spacing: 2px;

    z-index: 60;

    animation:
        tapPulse 2s infinite;
}


@keyframes tapPulse {

    0%,
    100% {
        opacity: .4;
    }

    50% {
        opacity: 1;
    }
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:380px) {

    .envelope {

        width: 290px;
        height: 195px;
    }

    .letter {

        width: 90%;

        min-height: 230px;

        padding:
            22px 14px;
    }

    .message {

        font-size: 14px;

        line-height: 1.55;
    }

    .cute-line {

        font-size: 22px;
    }

    .last {

        font-size: 13px;
    }
}

</style>
</head>


<body>


<!-- soft background glow -->

<div class="glow one"></div>
<div class="glow two"></div>


<!-- floating hearts -->

<div class="heart" style="left:8%;--time:7s;--delay:0s;"></div>

<div class="heart" style="left:22%;--time:6s;--delay:2s;"></div>

<div class="heart" style="left:78%;--time:8s;--delay:1s;"></div>

<div class="heart" style="left:91%;--time:6s;--delay:3s;"></div>


<!-- ENVELOPE -->

<div class="envelope" id="envelope">


    <!-- LETTER -->

    <div class="letter">

        <p class="message">

            Just a little note to remind you that
            you're genuinely special to me.

            <br><br>

            I hope you always remember how loved
            and appreciated you are.

        </p>


        <div class="cute-line">
            ♡ ♡ ♡
        </div>


        <p class="last">

            Keep smiling, okay?
            You deserve all the good things. ❤️

        </p>

    </div>


    <!-- ENVELOPE -->

    <div class="envelope-body"></div>


    <!-- HEART SEAL -->

    <div class="seal">
        ♥
    </div>


    <!-- RIBBON -->

    <div class="ribbon"></div>


    <!-- BURST PARTICLES -->

    <div class="burst" style="--x:-150px;--y:-80px;"></div>
    <div class="burst" style="--x:-120px;--y:-120px;"></div>
    <div class="burst" style="--x:-90px;--y:-55px;"></div>
    <div class="burst" style="--x:-160px;--y:20px;"></div>
    <div class="burst" style="--x:-120px;--y:70px;"></div>

    <div class="burst" style="--x:150px;--y:-80px;"></div>
    <div class="burst" style="--x:120px;--y:-120px;"></div>
    <div class="burst" style="--x:90px;--y:-55px;"></div>
    <div class="burst" style="--x:160px;--y:20px;"></div>
    <div class="burst" style="--x:120px;--y:70px;"></div>


    <!-- SIDE EXPLOSION -->

    <div class="side-glitter" style="--sx:-180px;--sy:-20px;"></div>
    <div class="side-glitter" style="--sx:-150px;--sy:-70px;"></div>
    <div class="side-glitter" style="--sx:-120px;--sy:-110px;"></div>
    <div class="side-glitter" style="--sx:-180px;--sy:50px;"></div>
    <div class="side-glitter" style="--sx:-130px;--sy:100px;"></div>

    <div class="side-glitter" style="--sx:180px;--sy:-20px;"></div>
    <div class="side-glitter" style="--sx:150px;--sy:-70px;"></div>
    <div class="side-glitter" style="--sx:120px;--sy:-110px;"></div>
    <div class="side-glitter" style="--sx:180px;--sy:50px;"></div>
    <div class="side-glitter" style="--sx:130px;--sy:100px;"></div>


</div>


<!-- tap text -->

<div class="tap">
    tap the envelope ♡
</div>


<script>

/* =====================================================
   CREATE MANY BACKGROUND GLITTERS
===================================================== */

for (let i = 0; i < 75; i++) {

    const glitter = document.createElement("div");

    glitter.className = "glitter";

    glitter.style.left =
        Math.random() * 100 + "vw";

    glitter.style.top =
        Math.random() * 100 + "vh";

    glitter.style.setProperty(
        "--duration",
        (1.5 + Math.random() * 3) + "s"
    );

    glitter.style.setProperty(
        "--delay",
        (Math.random() * 3) + "s"
    );

    const size =
        2 + Math.random() * 4;

    glitter.style.width =
        size + "px";

    glitter.style.height =
        size + "px";

    document.body.appendChild(glitter);
}


/* =====================================================
   OPEN ENVELOPE
===================================================== */

const envelope =
    document.getElementById("envelope");

envelope.addEventListener(
    "click",
    function () {

        this.classList.toggle("open");

    }
);

</script>

</body>
    </html>
