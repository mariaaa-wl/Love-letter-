<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>A Little Something ❤️</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    width: 100%;
    height: 100vh;
    overflow: hidden;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Georgia, serif;

    background:
        radial-gradient(circle at 20% 20%, #ffb2c3 0 3px, transparent 4px),
        radial-gradient(circle at 80% 30%, #ffb2c3 0 3px, transparent 4px),
        radial-gradient(circle at 40% 80%, #ffb2c3 0 2px, transparent 3px),
        linear-gradient(135deg, #ff7895, #ff9db0);

    position: relative;
}


/* =========================
   BACKGROUND SPARKLES
========================= */

.bg-star {
    position: fixed;
    color: white;
    font-size: 20px;
    opacity: .7;
    animation: twinkle 2s infinite alternate;
    pointer-events: none;
}

.star1 {
    top: 12%;
    left: 15%;
}

.star2 {
    top: 22%;
    right: 15%;
    animation-delay: .7s;
}

.star3 {
    bottom: 20%;
    left: 12%;
    animation-delay: 1s;
}

.star4 {
    bottom: 15%;
    right: 12%;
    animation-delay: .3s;
}

.star5 {
    top: 8%;
    left: 50%;
    animation-delay: 1.4s;
}

@keyframes twinkle {

    from {
        opacity: .2;
        transform: scale(.7);
    }

    to {
        opacity: 1;
        transform: scale(1.3);
    }
}


/* =========================
   FLOATING HEARTS
========================= */

.floating-heart {
    position: fixed;
    bottom: -40px;

    color: #d91645;

    font-size: 24px;

    pointer-events: none;

    animation: heartFloat linear infinite;
}

.h1 {
    left: 8%;
    animation-duration: 7s;
}

.h2 {
    left: 25%;
    animation-duration: 6s;
    animation-delay: 2s;
    font-size: 17px;
}

.h3 {
    left: 75%;
    animation-duration: 8s;
    animation-delay: 1s;
}

.h4 {
    left: 90%;
    animation-duration: 6s;
    animation-delay: 3s;
    font-size: 18px;
}

@keyframes heartFloat {

    0% {
        transform: translateY(0) rotate(0);
        opacity: 0;
    }

    15% {
        opacity: .8;
    }

    100% {
        transform: translateY(-115vh) rotate(30deg);
        opacity: 0;
    }
}


/* =========================
   ENVELOPE
========================= */

.envelope {
    width: 325px;
    height: 215px;

    position: relative;

    cursor: pointer;

    z-index: 10;

    filter: drop-shadow(0 18px 25px rgba(120, 30, 60, .25));

    animation: envelopeIdle 3s ease-in-out infinite;
}

@keyframes envelopeIdle {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-5px);
    }
}


/* =========================
   ENVELOPE BODY
========================= */

.envelope-body {
    position: absolute;

    width: 100%;
    height: 100%;

    background: #f5d46c;

    border-radius: 8px;

    overflow: hidden;

    z-index: 4;
}


/* diagonal envelope design */

.envelope-body::before {

    content: "";

    position: absolute;

    width: 100%;
    height: 100%;

    background: #eac55b;

    clip-path: polygon(
        0 0,
        50% 55%,
        100% 0,
        100% 100%,
        0 100%
    );
}


/* decorative border */

.envelope-body::after {

    content: "";

    position: absolute;

    inset: 7px;

    border: 2px dashed rgba(255,255,255,.55);

    border-radius: 5px;

    pointer-events: none;
}


/* =========================
   LETTER
========================= */

.letter {

    position: absolute;

    width: 88%;
    min-height: 190px;

    left: 6%;
    top: 8px;

    background: #fffdf9;

    padding: 23px 17px;

    text-align: center;

    border-radius: 3px;

    box-shadow:
        0 5px 15px rgba(80,30,40,.15);

    z-index: 2;

    transition:
        transform 1.15s cubic-bezier(.17,.89,.32,1.28);

}


/* paper little lines */

.letter::before {

    content: "";

    position: absolute;

    inset: 10px;

    border: 1px solid #f0dfe3;

    pointer-events: none;
}


.letter-text {

    position: relative;

    margin: 0;

    color: #4d3940;

    font-size: 16px;

    line-height: 1.55;

}


.cute {

    position: relative;

    margin-top: 8px;

    font-size: 34px;

    animation: cuteBounce 1.6s ease-in-out infinite;
}


@keyframes cuteBounce {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-5px);
    }
}


.last {

    position: relative;

    margin-top: 6px;

    color: #4d3940;

    font-size: 14px;

    line-height: 1.4;

    font-weight: bold;
}


/* =========================
   SMALL RIBBON
========================= */

.ribbon {

    position: absolute;

    width: 55px;
    height: 18px;

    background: #ed7188;

    left: 50%;
    bottom: -5px;

    transform: translateX(-50%);

    z-index: 7;

    border-radius: 4px;
}


/* =========================
   SEAL
========================= */

.seal {

    position: absolute;

    width: 52px;
    height: 52px;

    left: 50%;
    bottom: 74px;

    transform: translateX(-50%);

    background: #e83d58;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 25px;

    box-shadow:
        0 4px 10px rgba(120,0,30,.25),
        0 0 0 5px rgba(255,255,255,.2);

    z-index: 8;

    transition:
        .5s ease;
}


/* =========================
   OPEN STATE
========================= */

.envelope.open .letter {

    transform:
        translateY(-150px)
        rotate(-1deg);

}


.envelope.open .seal {

    opacity: 0;

    transform:
        translateX(-50%)
        scale(0);
}


.envelope.open {

    animation: none;
}


/* =========================
   SPARKLE EXPLOSION
========================= */

.sparkle {

    position: absolute;

    left: 50%;
    top: 45%;

    width: 8px;
    height: 8px;

    background: white;

    border-radius: 50%;

    opacity: 0;

    pointer-events: none;

    z-index: 20;
}


/* individual particles */

.envelope.open .sparkle {

    animation:
        sparkleBurst .9s ease-out forwards;
}


.sparkle:nth-child(1) {
    --x: -160px;
    --y: -55px;
}

.sparkle:nth-child(2) {
    --x: -120px;
    --y: -100px;
}

.sparkle:nth-child(3) {
    --x: -80px;
    --y: -35px;
}

.sparkle:nth-child(4) {
    --x: -145px;
    --y: 35px;
}

.sparkle:nth-child(5) {
    --x: -100px;
    --y: 80px;
}

.sparkle:nth-child(6) {
    --x: 160px;
    --y: -55px;
}

.sparkle:nth-child(7) {
    --x: 120px;
    --y: -100px;
}

.sparkle:nth-child(8) {
    --x: 80px;
    --y: -35px;
}

.sparkle:nth-child(9) {
    --x: 145px;
    --y: 35px;
}

.sparkle:nth-child(10) {
    --x: 100px;
    --y: 80px;
}


@keyframes sparkleBurst {

    0% {
        opacity: 1;
        transform:
            translate(-50%,-50%)
            scale(.3);
    }

    100% {
        opacity: 0;
        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% + var(--y))
            )
            scale(1.5);
    }
}


/* =========================
   PARTY CONFETTI
========================= */

.confetti {

    position: absolute;

    width: 7px;
    height: 13px;

    background: #fff;

    top: 45%;
    left: 50%;

    opacity: 0;

    z-index: 25;

    pointer-events: none;
}


.envelope.open .confetti {

    animation:
        confettiPop 1.1s ease-out forwards;
}


.confetti:nth-child(12) {
    --cx: -140px;
    --cy: -70px;
    --rot: -40deg;
}

.confetti:nth-child(13) {
    --cx: -100px;
    --cy: -120px;
    --rot: 30deg;
}

.confetti:nth-child(14) {
    --cx: -60px;
    --cy: -70px;
    --rot: 70deg;
}

.confetti:nth-child(15) {
    --cx: 140px;
    --cy: -70px;
    --rot: 40deg;
}

.confetti:nth-child(16) {
    --cx: 100px;
    --cy: -120px;
    --rot: -30deg;
}

.confetti:nth-child(17) {
    --cx: 60px;
    --cy: -70px;
    --rot: -70deg;
}


@keyframes confettiPop {

    0% {

        opacity: 1;

        transform:
            translate(-50%,-50%)
            rotate(0deg);

    }

    100% {

        opacity: 0;

        transform:
            translate(
                calc(-50% + var(--cx)),
                calc(-50% + var(--cy))
            )
            rotate(var(--rot));

    }
}


/* =========================
   TAP TEXT
========================= */

.tap {

    position: fixed;

    bottom: 38px;

    color: white;

    font-family: Arial, sans-serif;

    font-size: 14px;

    letter-spacing: 1.5px;

    opacity: .8;

    animation: tapPulse 2s infinite;

    z-index: 30;
}


@keyframes tapPulse {

    0%,100% {
        opacity: .45;
    }

    50% {
        opacity: 1;
    }
}


/* =========================
   MOBILE
========================= */

@media(max-width:380px) {

    .envelope {
        width: 290px;
        height: 195px;
    }

    .letter {
        width: 88%;
        min-height: 175px;
        padding: 20px 13px;
    }

    .letter-text {
        font-size: 14px;
    }

    .cute {
        font-size: 30px;
    }

    .last {
        font-size: 12px;
    }

}

</style>
</head>


<body>


<!-- background stars -->

<div class="bg-star star1">✦</div>
<div class="bg-star star2">✧</div>
<div class="bg-star star3">✦</div>
<div class="bg-star star4">✧</div>
<div class="bg-star star5">✦</div>


<!-- floating hearts -->

<div class="floating-heart h1">♥</div>
<div class="floating-heart h2">♥</div>
<div class="floating-heart h3">♥</div>
<div class="floating-heart h4">♥</div>


<!-- envelope -->

<div class="envelope" id="envelope">


    <!-- letter -->

    <div class="letter">

        <p class="letter-text">

            Just a little note to remind you that
            you're genuinely special to me.

            <br>

            I hope you always remember how loved
            and appreciated you are.

        </p>


        <div class="cute">
            ♡
        </div>


        <p class="last">

            Keep smiling, okay?
            You deserve all the good things.
            ❤️

        </p>

    </div>


    <!-- envelope -->

    <div class="envelope-body"></div>


    <!-- seal -->

    <div class="seal">
        ❤️
    </div>


    <div class="ribbon"></div>


    <!-- sparkle explosion -->

    <div class="sparkle">✦</div>
    <div class="sparkle">✦</div>
    <div class="sparkle">✧</div>
    <div class="sparkle">✦</div>
    <div class="sparkle">✧</div>

    <div class="sparkle">✦</div>
    <div class="sparkle">✧</div>
    <div class="sparkle">✦</div>
    <div class="sparkle">✧</div>
    <div class="sparkle">✦</div>


    <!-- confetti -->

    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>
    <div class="confetti"></div>


</div>


<div class="tap">
    tap the envelope ♡
</div>


<script>

const envelope = document.getElementById("envelope");

envelope.addEventListener("click", function() {

    this.classList.toggle("open");

});

</script>


</body>
</html>
