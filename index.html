<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>A Little Letter ❤️</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff7895, #ff9aae);
      font-family: Georgia, "Times New Roman", serif;
    }

    /* Floating hearts */

    .heart {
      position: fixed;
      color: #d90032;
      font-size: 28px;
      pointer-events: none;
      animation: floatUp linear infinite;
      opacity: 0.75;
      z-index: 1;
    }

    .h1 {
      left: 8%;
      bottom: -40px;
      animation-duration: 7s;
    }

    .h2 {
      left: 25%;
      bottom: -40px;
      font-size: 20px;
      animation-duration: 5s;
      animation-delay: 1s;
    }

    .h3 {
      left: 45%;
      bottom: -40px;
      animation-duration: 8s;
      animation-delay: 2s;
    }

    .h4 {
      left: 67%;
      bottom: -40px;
      font-size: 21px;
      animation-duration: 6s;
      animation-delay: 1s;
    }

    .h5 {
      left: 86%;
      bottom: -40px;
      animation-duration: 7s;
      animation-delay: 3s;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }

      15% {
        opacity: 0.8;
      }

      100% {
        transform: translateY(-115vh) rotate(25deg);
        opacity: 0;
      }
    }

    /* Envelope */

    .envelope {
      position: relative;
      width: 330px;
      height: 225px;
      cursor: pointer;
      z-index: 10;
    }

    /* Back of envelope */

    .envelope-back {
      position: absolute;
      width: 100%;
      height: 100%;
      background: #f4d267;
      border-radius: 3px;
      box-shadow: 0 18px 35px rgba(90, 25, 40, 0.25);
      z-index: 1;
    }

    /* Letter */

    .letter {
      position: absolute;
      width: 88%;
      height: 190px;
      left: 6%;
      top: 10px;

      background: #fffdf9;
      padding: 25px 18px;

      text-align: center;

      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.12);

      z-index: 2;

      transition:
        transform 1s cubic-bezier(.22,.61,.36,1),
        box-shadow 1s ease;
    }

    .letter-text {
      color: #49383d;
      font-size: 17px;
      line-height: 1.55;
      margin: 0;
    }

    .cute {
      margin-top: 10px;
      font-size: 35px;
      animation: bounce 1.5s ease-in-out infinite;
    }

      margin-top: 8px;
      color: #49383d;
      font-size: 15px;
